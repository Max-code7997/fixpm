name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest)
        run: pytest -q

  probe:
    name: Go probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python is needed by the generators, which read the rule tables that the
      # Go probe is built from. Go is needed because the rule generator pipes
      # its output through gofmt, so --check compares like with like.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          # No go.sum (the probe has no dependencies), so the cache step would
          # only warn.
          cache: false

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generated rule tables and vectors must be up to date
        # Without this the Go probe silently drifts away from the Python rule
        # tables, which is exactly the failure mode the generators exist to
        # prevent.
        run: |
          python scripts/gen_go_rules.py --check
          python scripts/gen_parity_vectors.py --check

      - name: Vet
        run: go vet ./...
        working-directory: go

      - name: Format check
        run: test -z "$(gofmt -l .)"
        working-directory: go

      - name: Parity with the Python reference
        run: go test ./...
        working-directory: go

  # The release workflow builds this binary on three platforms; until now
  # nothing ran the result, and a macOS build that aborts on startup shipped
  # straight to the release job. Building AND running it here is the gate that
  # would have caught it.
  probe-binary:
    name: Probe binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: false

      - name: Build
        working-directory: go
        run: go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/fixpm-probe" .

      - name: Run it
        shell: bash
        run: |
          set +e
          out=$("$RUNNER_TEMP/fixpm-probe" --dry-run "docker container lss" 2>&1)
          rc=$?
          echo "exit=$rc"
          echo "$out"
          if [ "$rc" -ne 0 ] || ! printf '%s' "$out" | grep -q "docker container ls"; then
            # Annotations stay readable without repository access, unlike step
            # logs; a bare "exit code 134" costs a whole debugging round-trip.
            echo "::error title=probe unusable on ${{ matrix.os }}::exit=$rc uname=$(uname -sm) go=$(go version | cut -d' ' -f3) output=${out}"
            exit 1
          fi
