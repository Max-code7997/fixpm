name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest)
        run: pytest -q

  probe:
    name: Go probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python is needed by the generators, which read the rule tables that the
      # Go probe is built from. Go is needed because the rule generator pipes
      # its output through gofmt, so --check compares like with like.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          # No go.sum (the probe has no dependencies), so the cache step would
          # only warn.
          cache: false

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generated rule tables and vectors must be up to date
        # Without this the Go probe silently drifts away from the Python rule
        # tables, which is exactly the failure mode the generators exist to
        # prevent.
        run: |
          python scripts/gen_go_rules.py --check
          python scripts/gen_parity_vectors.py --check

      - name: Vet
        run: go vet ./...
        working-directory: go

      - name: Format check
        run: test -z "$(gofmt -l .)"
        working-directory: go

      - name: Parity with the Python reference
        run: go test ./...
        working-directory: go

  # The formula is the one install channel that cannot be exercised from the
  # development machine (Homebrew does not run on Windows), so it gets a real
  # `brew install` here. It also verifies the released macOS binary, which
  # nothing else does: `--version` on a binary the runner cannot execute is
  # exactly the failure the 0.3.1 probe had.
  homebrew-formula:
    name: Homebrew formula (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the formula from this commit
        shell: bash
        run: |
          set +e
          # `brew install <path>` is rejected: formulae must live in a tap. So
          # expose this directory as one, which tests the file in this commit
          # rather than whatever the published tap currently points at.
          tapdir="$(brew --repository)/Library/Taps/maxcode7997/homebrew-fixpm"
          mkdir -p "$(dirname "$tapdir")"
          ln -sfn "$PWD/packaging/homebrew-fixpm" "$tapdir"
          out=$(brew install maxcode7997/fixpm/fixpm 2>&1)
          rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error title=brew install failed::$(printf '%s' "$out" | tail -25 | tr '\n' '|' | tr -d '\r')"
            exit 1
          fi

      - name: The formula's own test
        shell: bash
        run: |
          set +e
          out=$(brew test maxcode7997/fixpm/fixpm 2>&1)
          rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error title=brew test failed::$(printf '%s' "$out" | tail -25 | tr '\n' '|' | tr -d '\r')"
            exit 1
          fi

      - name: Both binaries must run
        shell: bash
        run: |
          version=$(sed -n 's/^version "\(.*\)"/\1/p' packaging/homebrew-fixpm/Formula/fixpm.rb)
          fail=0
          check() {  # <label> <expected substring> <command...>
            label="$1"; want="$2"; shift 2
            out=$("$@" 2>&1); rc=$?
            printf '%-12s exit=%s  %s\n' "$label" "$rc" "$out"
            if [ "$rc" -ne 0 ] || ! printf '%s' "$out" | grep -qF "$want"; then
              # One short annotation per failure: a single long message gets
              # clipped on the run page, which is the only log a non-owner sees.
              echo "::error title=$label does not work on macOS::exit=$rc want=[$want] got=[$(printf '%s' "$out" | head -c 180 | tr '\n' '|')]"
              fail=1
            fi
          }
          check fixpm       "fixpm $version"       fixpm --version
          check probe       "fixpm-probe $version" fixpm-probe --version
          check fixpm-fix   "docker container ls"  fixpm --dry-run "docker container lss"
          check probe-fix   "go mod tidy"          fixpm-probe --dry-run "go mod tidyy"
          if [ "$fail" -ne 0 ]; then
            echo "::warning title=macos diagnostics::$(sw_vers -productVersion) $(file "$(command -v fixpm)" | cut -d: -f2- | tr -d '\r') codesign=[$(codesign -dvv "$(command -v fixpm)" 2>&1 | tr '\n' ' ')]"
            exit 1
          fi

  # The release workflow builds this binary on three platforms; until now
  # nothing ran the result, and a macOS build that aborts on startup shipped
  # straight to the release job. Building AND running it here is the gate that
  # would have caught it.
  probe-binary:
    name: Probe binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: false

      - name: Build
        working-directory: go
        run: go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/fixpm-probe" .

      - name: Run it
        shell: bash
        run: |
          set +e
          out=$("$RUNNER_TEMP/fixpm-probe" --dry-run "docker container lss" 2>&1)
          rc=$?
          echo "exit=$rc"
          echo "$out"
          if [ "$rc" -ne 0 ] || ! printf '%s' "$out" | grep -q "docker container ls"; then
            # Annotations stay readable without repository access, unlike step
            # logs; a bare "exit code 134" costs a whole debugging round-trip.
            echo "::error title=probe unusable on ${{ matrix.os }}::exit=$rc uname=$(uname -sm) go=$(go version | cut -d' ' -f3) output=${out}"
            exit 1
          fi
