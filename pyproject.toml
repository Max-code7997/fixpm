[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fixpm"
dynamic = ["version"]
description = "Interactive fixer for broken npm / npx / pnpm / yarn commands."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "fixpm contributors" }]
requires-python = ">=3.10"
keywords = ["npm", "npx", "pnpm", "yarn", "cli", "typo", "did-you-mean"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "questionary>=2.0",
]

[project.urls]
Homepage = "https://github.com/Max-code7997/fixpm"
Repository = "https://github.com/Max-code7997/fixpm"
Issues = "https://github.com/Max-code7997/fixpm/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
fixpm = "fixpm.cli:app"

[tool.hatch.version]
path = "src/fixpm/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = ["docs", "dist"]

[tool.hatch.build.targets.wheel]
packages = ["src/fixpm"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]  # B008: typer uses function calls in defaults by design

[tool.pytest.ini_options]
testpaths = ["tests"]
